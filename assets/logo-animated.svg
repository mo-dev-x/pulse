<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 72" width="270" height="72" role="img" aria-label="PULSE">
  <title>PULSE</title>
  <desc>A rounded square with a heartbeat line, beside the PULSE wordmark.</desc>
  <style>
    .beat { animation: beat 6s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes beat {
      0% { stroke-dasharray: 100 100; stroke-dashoffset: 100; }
      40% { stroke-dasharray: 100 100; stroke-dashoffset: 0; }
      78% { stroke-dasharray: 100 100; stroke-dashoffset: 0; }
      100% { stroke-dasharray: 100 100; stroke-dashoffset: -100; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="6" y="8" width="56" height="56" rx="15" fill="#e8436f"/>
  <polyline points="13,38 24,38 29,27 35,49 41,22 46,38 55,38" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline class="beat" pathLength="100" points="13,38 24,38 29,27 35,49 41,22 46,38 55,38" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="49" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="5" fill="#16161d">PULSE</text>
</svg>
