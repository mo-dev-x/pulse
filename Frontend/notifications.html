<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PULSE — Notifications</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
  <div id="offlineBanner" class="error" hidden>You are offline. Notifications may be stale.</div>
  <header class="topbar">
    <div class="topbar-left"><div class="brand">PULSE</div></div>
    <div class="topbar-center"></div>
    <div class="topbar-right">
      <button class="iconbtn" data-theme-toggle aria-label="Toggle theme">☀️</button>
      <a class="btn btn-ghost" href="feed.html">Feed</a>
    </div>
  </header>
  <div class="app app-shell-main">
    <main class="main">
      <section class="panel analytics-card">
        <div class="panel-title">
          <span>Notifications</span>
          <button id="markAllRead" class="btn btn-ghost btn-sm">Mark all read</button>
        </div>
        <div class="state" id="notifSummary">Loading...</div>
        <div class="notification-list" id="notificationList"></div>
      </section>
    </main>
  </div>
  <script type="module" src="js/notifications.js"></script>
</body>
</html>
