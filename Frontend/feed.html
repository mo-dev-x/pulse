<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>PULSE — Feed</title>
        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
        <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/feed.css">
    </head>

<body>
    <div id="offlineBanner" class="error" hidden>You are offline. Feed updates may be delayed.</div>
    <!-- TOPPPP BAR -->
    <header class="topbar">
        <div class="topbar-left">
            <a class="brand" href="feed.html">PULSE</a>
        </div>

        <div class="topbar-center">
            <div class="search">
                <i class="uil uil-search"></i>
                <input id="globalSearch" type="search" placeholder="Search for posts, campus' news and friends" />
            </div>
            <div id="searchResults" class="search-results">
            </div>
        </div>

        <div class="topbar-right">
            <button class="iconbtn" type="button" data-theme-toggle aria-label="Toggle theme">☀️</button>
            <button id="btnOpenCreateTop" class="btn btn-accent">Create</button>

            <div class="userchip" id="userChip">
                <a href="profile.html" class="topbar-profile-link" id="topbarProfileLink" aria-label="Go to profile">
                    <img class="avatar" id="topbarAvatar" src="assets/default-avatar.svg" alt="Profile" />
                </a>

                <span class="caret">▾</span>

                <div class="menu" id="userMenu">
                    <a class="menu-link" href="profile.html">View Profile</a>
                    <button id="btnLogout" class="menu-item">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- APP GRIDDDDD -->
    <div class="app">
        <!-- LEFT SIDEBARRRRRRR -->
        <aside class="sidebar">
            <div class="panel profile">
                <a href="profile.html" class="profile-link">
                    <div class="profile-row">
                        <img class="avatar-lg" id="sidebarAvatar" src="assets/default-avatar.svg" alt="You" />
                        <div>
                            <div class="name" id="meName">Loading...</div>
                            <div class="handle" id="meHandle">@loading</div>
                        </div>
                    </div>
                </a>
            </div>

            <nav class="panel nav">
                <a class="nav-item active" href="feed.html">
                    <span><i class="uil uil-home"></i></span>Home
                </a>

                <a class="nav-item" href="discover.html">
                    <span><i class="uil uil-compass"></i></span>Explore
                </a>

                <a class="nav-item" href="zone.html">
                    <i class="uil uil-map-marker"></i>
                    <span>Zones</span>
                </a>

                <a class="nav-item" href="analytics.html">
                    <i class="uil uil-smile"></i>
                    <span>Mood Dashboard</span>
                </a>
                <a class="nav-item" href="messages.html">
                    <i class="uil uil-envelope"></i>
                    <span>Messages</span>
                    <span class="inline-badge" data-message-badge hidden>0</span>
                </a>
                <a class="nav-item" href="notifications.html">
                    <i class="uil uil-bell"></i>
                    <span>Notifications</span>
                    <span class="inline-badge" data-notification-badge hidden>0</span>
                </a>
                <a class="nav-item" href="settings.html">
                    <i class="uil uil-setting"></i>
                    <span>Settings</span>
                </a>

                <button id="btnOpenCreateLeft" class="btn btn-full btn-accent">Create Post</button>
            </nav>
        </aside>

        <!-- CENTER FEEDDDDDDDD -->
        <main class="main">

            <!-- STORIESSSSSSSSSSS -->
            <section class="stories panel">
                <div class="stories-head">
                    <h3 class="stories-title">Campus Pulse</h3>
                </div>

                <div class="stories-row" id="storiesRow">
                    <!-- injected by JS -->
                </div>
            </section>


            <!-- COMPOSERRRRRR -->
            <section class="composer panel">
                <img class="avatar" id="composerAvatar" src="assets/default-avatar.svg" alt="You" />
                <button id="btnOpenCreateComposer" class="composer-input">
                    What’s on your mind ?
                </button>
                <button id="btnOpenCreateSmall" class="btn btn-accent btn-sm">Post</button>
            </section>

            <section class="panel feed-switcher">
                <button class="feed-filter active" data-feed-mode="home">Home Feed</button>
                <button class="feed-filter" data-feed-mode="myPosts">My Posts</button>
                <button class="feed-filter" data-feed-mode="myAnonymous">My Anonymous</button>
            </section>

            <!-- FEED LISTTTTTTTTT -->
            <section class="feed" id="feed">
                <!-- posts injected by JS-->
            </section>
            <div class="state" id="feedSentinel" style="display:none;"></div>

            <!-- LOADING / EMPTY -->
            <div class="state" id="stateBox">Loading feed…</div>
        </main>

        <!-- RIGHT PANELLLLLLLL -->
        <aside class="right">
            <section class="panel" id="campusMoodSidebar">
                <div class="panel-title">
                    <span>Campus today</span>
                </div>
                <div id="campusMoodList">
                    <!-- injected by JS -->
                </div>
            </section>
        </aside>
    </div>

    <!-- CREATE POST MODALLLLLLLL -->
    <div class="modal" id="createModal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-label="Create post">
            <div class="modal-head">
                <div class="modal-title">Create Post</div>
                <button id="btnCloseModal" class="iconbtn" aria-label="Close">✖️</button>
            </div>

            <form id="createForm" class="modal-body">
                <label class="label" for="postText">Text</label>
                <textarea id="postText" class="textarea" maxlength="500" placeholder="Write something (10–500 chars)..."
                    required></textarea>
                <div class="counter"><span id="charCount">0</span>/500</div>

                <!-- <div class="row">
                    <label class="checkbox checkbox-right">
                        <input id="anonymousToggle" type="checkbox" />
                        <span>Post anonymously</span>
                    </label> -->

                <!-- <div class="zone-picker">
                        <input id="zoneSearch" class="select" type="text" placeholder="Search campus zone..." autocomplete="off" />
                        <input id="zoneId" type="hidden" />
                        <div id="zoneResults" class="zone-results"></div>
                    </div> -->
                <!-- 
                    <div class="row">
                        <div class="zone-picker">
                            <input id="zoneSearch" class="select" type="text" placeholder="Search campus zone..." autocomplete="off" />
                            <input id="zoneId" type="hidden" />
                            <div id="zoneResults" class="zone-results"></div>
                        </div>
                    </div>

                    <div class="row">
                        <label class="file">
                            <i class="uil uil-camera"></i>Image
                            <input id="imageFile" type="file" accept="image/*" />
                        </label>
                    </div>
                                    
                   
                    <label class="file">
                        <i class="uil uil-video"></i>Video
                        <input id="videoFile" type="file" accept="video/*" />
                    </label> -->
                <!-- </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="btnCancel">Cancel</button>
                    <button type="submit" class="btn btn-accent">Post</button>
                </div> -->
                <div class="row row-zone-top">
                    <div class="zone-picker">
                        <input id="zoneSearch" class="select" type="text" placeholder="Search campus zone..."
                            autocomplete="off" />
                        <input id="zoneId" type="hidden" />
                        <div id="zoneResults" class="zone-results"></div>
                    </div>
                </div>

                <div class="row row-bottom">
                    <label class="file">
                        <i class="uil uil-camera"></i>Image
                        <input id="imageFile" type="file" accept="image/*" />
                    </label>

                    <label class="checkbox checkbox-bottom-right">
                        <input id="anonymousToggle" type="checkbox" />
                        <span>Post anonymously</span>
                    </label>
                </div>

                <div id="imagePreviewWrap" class="image-preview-wrap" hidden>
                    <div class="image-preview-head">
                        <span>Post image preview</span>
                        <button id="clearImagePreview" type="button" class="btn btn-ghost btn-sm">Remove</button>
                    </div>
                    <img id="imagePreview" class="image-preview" alt="Selected post image preview" />
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="btnCancel">Cancel</button>
                    <button type="submit" class="btn btn-accent">Post</button>
                </div>

                <div class="error" id="createError" style="display:none;"></div>
                <p id="create-resend-verification" style="display:none;">
                  <a id="create-resend-link" class="link" href="#">Resend verification email</a>
                </p>
            </form>
        </div>
    </div>
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="js/zone_autocomplete.js"></script>
    <script type="module" src="js/feed.js"></script>
</body>

</html>
