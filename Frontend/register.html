<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PULSE — Register</title>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div>
          <h1>PULSE</h1>
          <p>Create your account</p>
        </div>
      </div>

      <form class="form" id="registerForm">
        <div id="error" class="error" style="display:none;"></div>
<!-- 
        display_name
        <div class="field">
          <label class="label" for="display_name">Display name</label>
          <input class="input" id="display_name" type="text" placeholder="Your public name" required>
        </div> -->

        <!-- username -->
        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" type="text" placeholder="yourname" required>
        </div>

        <div class="field">
          <label class="label" for="email">Email (@ulaval.ca)</label>
          <input class="input" id="email" type="email" placeholder="name@ulaval.ca" required>
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="••••••••" required>
        </div>

        <button class="btn btn-primary" type="submit">Create account</button>

        <p class="bottom">
          Already have an account?
          <a class="link" href="login.html">Login</a>
        </p>
      </form>
    </section>
  </main>
  <script type="module" src="js/register.js"></script>
</body>
</html>
