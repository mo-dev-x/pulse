<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PULSE — Offline</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      font-family: var(--font-sans);
    }
    .offline-card {
      text-align: center;
      padding: 48px 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 380px;
      width: 90%;
    }
    .offline-icon { margin-bottom: 16px; color: var(--muted); }
    .offline-icon .ui-icon { --ui-icon-size: 64px; }
    .offline-title { font-size: 22px; font-weight: 800; color: var(--text); margin: 0 0 8px; }
    .offline-sub { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0 0 28px; }
    .btn-retry {
      display: inline-block;
      padding: 10px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-retry:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon"><i class="ui-icon ui-icon--muted uil uil-wifi-slash"></i></div>
    <h1 class="offline-title">You're offline</h1>
    <p class="offline-sub">
      PULSE needs a connection to load new content.<br />
      Check your network and try again.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
