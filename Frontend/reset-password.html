<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ff4d7d" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon-192.svg" />
  <title>PULSE — Reset Password</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <button type="button" class="lang-toggle" data-lang-toggle>FR</button>
      <div class="brand">
        <div>
          <h1 data-i18n="auth.reset.title">Choose a new password</h1>
          <p data-i18n="auth.reset.subtitle">Paste the reset token from the email and set a new password.</p>
        </div>
      </div>

      <form class="form" id="resetPasswordForm">
        <p id="error" class="error" style="display:none;"></p>
        <p id="msg" class="msg" style="display:none;"></p>
        <label class="label" for="token" data-i18n="auth.reset.token">Reset token</label>
        <input class="input" id="token" type="text" required />

        <label class="label" for="newPassword" data-i18n="auth.reset.new_password">New password</label>
        <input class="input" id="newPassword" type="password" minlength="8" required />

        <button class="btn" type="submit" data-i18n="auth.reset.submit">Reset password</button>
        <p class="bottom">
          <a class="link" href="login.html" data-i18n="auth.reset.back">Back to login</a>
        </p>
      </form>
    </section>
  </main>
  <script type="module" src="js/reset_password.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
