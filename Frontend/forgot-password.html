<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PULSE — Forgot Password</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <button type="button" class="lang-toggle" data-lang-toggle>FR</button>
      <div class="brand">
        <div>
          <h1 data-i18n="auth.forgot.title">Reset your password</h1>
          <p data-i18n="auth.forgot.subtitle">We will send a reset link if the address exists.</p>
        </div>
      </div>

      <form class="form" id="forgotPasswordForm">
        <p id="error" class="error" style="display:none;"></p>
        <p id="msg" class="msg" style="display:none;"></p>
        <label class="label" for="email" data-i18n="common.email">Email</label>
        <input class="input" id="email" type="email" placeholder="name@ulaval.ca" required />
        <button class="btn" type="submit" data-i18n="auth.forgot.submit">Send reset link</button>
        <p class="bottom">
          <a class="link" href="login.html" data-i18n="auth.forgot.back">Back to login</a>
        </p>
      </form>
    </section>
  </main>
  <script type="module" src="js/forgot_password.js"></script>
</body>
</html>
