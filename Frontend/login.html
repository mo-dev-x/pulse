<!doctype html>
<html lang="en">
 <!-- gotta change it lang="fr" -->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PULSE — Login</title>
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div>
          <h1>ASLEEEEMAAAAA</h1>
          <p>Sign in to continue</p>
        </div>
      </div>

      <form class="form" id="loginForm">
        <p id="error" class="error" style="display:none;"></p>
        <p id="msg" class="msg" style="display:none;"></p>
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" placeholder="name@ulaval.ca" required>

        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" placeholder="••••••••" required>

        <div class="row">
          <label class="check">
            <input type="checkbox">
            <span>Remember me</span>
          </label>

          <a class="link" href="#">Forgot?</a>
        </div>

        <button class="btn" type="submit">Login</button>

        <p class="bottom">
          No account?
          <a class="link" href="register.html">Create one</a>
        
        </p>
      </form>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>

</body>
</html>
