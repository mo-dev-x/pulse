<!doctype html>
<html lang="en">
 <!-- gotta change it lang="fr" -->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PULSE — Login</title>
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div>
          <h1>PULSE</h1> <!-- gotta change it to PULSE T^T-->
          <p>Sign in to continue to your campus wellness feed</p>
        </div>
      </div>

      <form class="form" id="loginForm">
        <p id="error" class="error" style="display:none;"></p>
        <p id="msg" class="msg" style="display:none;"></p>
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" placeholder="name@ulaval.ca" required>

        <label class="label" for="password">Password</label>
        <div class="password-wrapper">
          <input
            class="input"
            id="password"
            type="password"
            placeholder="••••••••"
            required
          >
          <button type="button" id="togglePassword" class="toggle-password">
            👁
          </button>
        </div>
        
        <div class="row">
          <label class="check">
            <input id="rememberMe" type="checkbox">
            <span>Remember me</span>
          </label>

          <a class="link" href="#">Forgot password?</a> <!-- gotta change it to href="forgot-password.html...." -->
        </div>

        <button class="btn" type="submit">Login</button>

        <p class="bottom">
          No account?
          <a class="link" href="register.html">Create one</a>
        
        </p>
      </form>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>

</body>
</html>
