<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ff4d7d" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon-192.svg" />
  <title>PULSE — Messages</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/messages.css">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css" />
</head>
<body>
  <div id="offlineBanner" class="dm-offline-banner" hidden>You are offline. Messages may not refresh.</div>

  <div class="dm-app">

    <!-- ── Left: conversation list ── -->
    <aside class="dm-sidebar" id="dmSidebar">
      <div class="dm-sidebar-header">
        <a class="dm-icon-btn dm-back-to-feed" href="feed.html" title="Back to feed">
          <i class="uil uil-arrow-left"></i>
        </a>
        <span class="dm-sidebar-title">Messages
          <span class="dm-badge" id="messageBadge" hidden>0</span>
        </span>
        <button class="dm-icon-btn" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
          <i class="uil uil-sun"></i>
        </button>
        <button class="dm-icon-btn" id="newMsgBtn" title="New conversation">
          <i class="uil uil-edit-alt"></i>
        </button>
      </div>

      <div class="dm-sidebar-search">
        <i class="uil uil-search dm-search-icon"></i>
        <input
          id="newConversationUsername"
          type="search"
          class="dm-search-input"
          placeholder="Search or start new chat with @username…"
          autocomplete="off"
        />
      </div>

      <div class="dm-conv-list" id="conversationList"></div>
    </aside>

    <!-- ── Right: thread ── -->
    <section class="dm-thread" id="dmThread">

      <!-- Empty state (no conversation selected) -->
      <div class="dm-empty" id="dmEmpty">
        <div class="dm-empty-ring">
          <i class="uil uil-comment-dots"></i>
        </div>
        <h3 class="dm-empty-title">Your messages</h3>
        <p class="dm-empty-sub">Send private messages to a friend.</p>
        <button class="dm-new-btn" id="newMsgBtnEmpty">
          <i class="uil uil-plus"></i> New message
        </button>
      </div>

      <!-- Chat header (shown when conversation is selected) -->
      <div class="dm-thread-header" id="threadHeader" hidden>
        <button class="dm-icon-btn dm-back-btn" id="backBtn" title="Back">
          <i class="uil uil-arrow-left"></i>
        </button>
        <a class="dm-thread-profile-link" id="threadProfileLink" href="#" title="View profile">
          <img class="dm-thread-avatar" id="threadAvatar" src="" alt="User" />
          <div class="dm-thread-meta">
            <span class="dm-thread-name" id="threadTitle">—</span>
          </div>
        </a>
      </div>

      <!-- Scrollable messages area -->
      <div class="dm-messages-area" id="messagesArea" hidden>
        <div class="dm-messages-inner" id="messageThread"></div>
      </div>

      <!-- Reply context strip (appears above compose bar when replying) -->
      <div class="dm-reply-context" id="dmReplyContext" hidden>
        <span class="dm-reply-label">Replying to:</span>
        <span class="dm-reply-preview"></span>
        <button class="dm-reply-cancel" type="button" id="dmReplyCancelBtn" aria-label="Cancel reply">
          <i class="uil uil-times"></i>
        </button>
      </div>

      <!-- Compose bar -->
      <form class="dm-compose" id="messageComposer" hidden>
        <button class="dm-icon-btn" type="button" id="imageAttachBtn" title="Send image">
          <i class="uil uil-image"></i>
        </button>
        <input id="imageAttachInput" type="file" accept="image/*,video/*" hidden />
        <button class="dm-icon-btn dm-audio-btn" type="button" id="audioRecordBtn" title="Send audio">
          <i class="uil uil-microphone"></i>
        </button>
        <div class="dm-compose-field">
          <input
            id="messageInput"
            class="dm-compose-input"
            type="text"
            placeholder="Message…"
            autocomplete="off"
          />
        </div>
        <button class="dm-send-btn" type="submit" title="Send">
          <i class="uil uil-message"></i>
        </button>
      </form>

    </section>
  </div>

  <!-- Right-click context menu for messages -->
  <div class="dm-ctx-menu" id="dmCtxMenu" hidden>
    <button class="dm-ctx-item dm-ctx-item--danger" id="dmCtxUnsend">
      <i class="uil uil-trash-alt"></i> Unsend
    </button>
  </div>

  <script type="module" src="js/messages.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
